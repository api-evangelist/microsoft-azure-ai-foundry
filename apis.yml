aid: microsoft-azure-ai-foundry
name: Microsoft Azure AI Foundry
description: >-
  Microsoft Azure AI Foundry is a unified platform for building, evaluating, and deploying generative AI applications.
  It provides a model catalog, prompt engineering tools, fine-tuning capabilities, retrieval augmented generation (RAG)
  patterns, and responsible AI evaluation across a comprehensive set of management and data plane APIs.
